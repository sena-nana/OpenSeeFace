[package]
name = "osf-ort"
version = "0.1.0"
edition = "2021"
license = "BSD-2-Clause"
description = "ort runtime for the OpenSeeFace ONNX models"
publish = false

[features]
default = []
# Load the same libonnxruntime as Python (ORT_DYLIB_PATH).
shared-ort = ["ort/load-dynamic"]

[[bin]]
name = "facetracker"
path = "src/bin/facetracker.rs"

[[bin]]
name = "osf-bench"
path = "src/bin/osf-bench.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"
half = "2"
minifb = "0.28"
nalgebra = "0.33"
nokhwa = { version = "0.10", default-features = false, features = ["input-native", "decoding"] }
ort = { version = "2.0.0-rc.13", features = ["half"] }
rand = "0.8"
rosc = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
