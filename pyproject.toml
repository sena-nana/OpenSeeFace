[project]
name = "openseeface"
version = "1.20.4"
description = "Facial landmark detection based on MobileNetV3"
readme = "README.md"
license = "BSD-2-Clause"
authors = [{ name = "emilianavt" }]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.3",
    "onnxruntime>=1.16.0",
    "opencv-python>=4.5.4",
    "pillow>=8.4.0",
]

[dependency-groups]
dev = [
    "psutil>=5.9.0",
]

[tool.uv]
package = false
